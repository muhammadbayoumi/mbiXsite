{{> navbar }}

  <main id="main-content">
    <section class="section-dark3" style="padding-top: 100px;" aria-labelledby="sxp-title">
      <div class="container py-5 text-center">
        <div class="section-tag mb-2" data-i18n="sx_tag">ScrapeX</div>
        <h1 id="sxp-title" class="section-title mb-3" data-i18n="sxp_title">Privacy Policy</h1>
        <p class="section-sub mx-auto" data-i18n="sxp_sub">
          Every piece of data ScrapeX touches, and where it lives.
        </p>
      </div>
    </section>

    <div class="glow-line" aria-hidden="true"></div>

    <section class="section-light py-section">
      <div class="container py-3">
        <!--
          Rendered from ScrapeX/docs/privacy-policy.md in mbiX-hub. That copy is
          asserted against the shipped extension by tests in the ScrapeX repo,
          so it is fetched rather than duplicated here — a retyped policy could
          drift out of agreement with those tests without anything failing.
        -->
        <article class="md-doc" data-sx-doc="privacy" aria-live="polite">
          <p class="md-notice" data-i18n="sx_doc_loading">Loading the policy…</p>
        </article>
      </div>
    </section>
  </main>

{{> footer }}
