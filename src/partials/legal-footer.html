    pages, and language-dropdown.js binds a single instance by id.

      <div class="legal-footer-links">

        <a href="{{{scrapexSupportUrl}}}" data-i18n="sxs_title">Support</a>
        <a href="{{{helpUrl}}}" data-i18n="nav_help">Help Center</a>
      </div>
    </div>
